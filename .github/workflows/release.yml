name: Release

# Trigger on version tags (e.g. v0.1.0) or manually for dry-runs.
#
# PyPI setup required before first release:
#   1. Go to https://pypi.org → Account → Publishing → Add a Pending Trusted Publisher:
#        - PyPI project name : zk-config-starter
#        - GitHub owner      : alimojahed
#        - Repository        : python-zk-config-starter
#        - Workflow filename  : release.yml
#        - Environment name  : pypi
#   2. In this GitHub repo → Settings → Environments → create "pypi"
#      (optionally add required reviewers for protection).
#   3. Cut a release: git tag v0.1.0 && git push origin v0.1.0
#
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip PyPI publish and GitHub Release)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so changelog generation works

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tool
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Check dist with twine
        run: |
          pip install twine
          twine check dist/*

      - name: Upload built artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Only publish when triggered by a real tag push, not a dry-run dispatch
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false')

    environment: pypi  # required by PyPI Trusted Publishers

    permissions:
      id-token: write   # OIDC token for PyPI
      contents: write   # create GitHub Release

    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (OIDC — no API token needed)
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # tag_name is inferred from the git ref automatically
