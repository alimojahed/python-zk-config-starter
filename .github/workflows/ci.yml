name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: "Python ${{ matrix.python-version }}"
    runs-on: ubuntu-22.04  # ubuntu-22.04 still ships Python 3.7 via deadsnakes

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.7", "3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # Python 3.7 is only available via deadsnakes on Ubuntu 22.04
          allow-prereleases: false

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        # ruff itself requires Python 3.7+; run only on 3.8+ to avoid version issues with the tool
        if: matrix.python-version != '3.7'
        run: ruff check .

      - name: Type-check (mypy)
        if: matrix.python-version != '3.7'
        run: mypy src

      - name: Run unit tests
        run: pytest --cov=zk_config_starter --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
